<body class="light">
  <div id="root">
    <div class="App">
      <header class="custom-header">
        <div class="header-container">
          <div class="header-logo"></div>
        </div>
      </header>
      <div class="product-page-wrapper">
        <div class="product-page-container">
          <div class="product-image-section"><img
              src="https://s3.ap-south-1.amazonaws.com/sepio-prod/company-product-management-live/file-1727509051701.png"
              alt="Saras Ghee 500 ml" class="product-image"></div>
          <div class="product-info-section">
            <div class="title-badge-row">
              <h2 class="product-title" id="product-title"></h2>
            </div>
            <div class="uid-under-title" id="product-uid"></div>
            <div class="product-detail-item"><span class="detail-value auth-status-text text-danger" id="product-status"></span></div>
            <div class="product-attributes">
              <div class="product-detail-item"><span class="detail-label">Batch No:</span><span class="detail-value" id="product-batch"></span></div>
              <div class="product-detail-item"><span class="detail-label">Expiry Date:</span><span class="detail-value" id="product-expiry"></span></div>
              <div class="product-detail-item"><span class="detail-label">Manufacture Date:</span><span class="detail-value" id="product-manufacture"></span></div>
              <div class="product-detail-item"><span class="detail-label">Mrp:</span><span class="detail-value" id="product-mrp"></span></div>
              <div class="product-detail-item"><span class="detail-label">Produced At:</span><span class="detail-value" id="product-produced-at"></span></div>
            </div>
            <div class="device-count-section">
              <p class="device-count-text" id="device-count-text"></p>
              <button class="view-more-btn">View more &#x25BC;</button>
              <div class="mt-3 border p-2 rounded" style="display: none;" id="scans-container">
                <h6 id="scans-count-heading"></h6>
                <div id="scans-list"></div>
                <p class="mt-2 text-muted" id="additional-scans-text"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>



  <script src="https://cdn.jsdelivr.net/npm/fingerprintjs2@2.1.0/dist/fingerprint2.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const toggleBtn = document.querySelector('.view-more-btn');
      const detailsDiv = document.querySelector('.mt-3.border.p-2.rounded');

      if (toggleBtn && detailsDiv) {
        toggleBtn.addEventListener('click', function () {
          if (detailsDiv.style.display === 'none' || detailsDiv.style.display === '') {
            detailsDiv.style.display = 'block';
            toggleBtn.innerHTML = 'Hide details &#x25B2;';
          } else {
            detailsDiv.style.display = 'none';
            toggleBtn.innerHTML = 'View more &#x25BC;';
          }
        });
      }
    });
  </script>
  <script src="index.js"></script>
</body>

</html>
